# ============================================================================
#  Configuración de despliegue (Wrangler v4)
#  Alternativa: copiar el contenido de src/index.js al panel de Cloudflare
#  Workers (Create Worker) y pegar las variables de [vars] en Settings.
# ============================================================================

# Se conserva el nombre del Worker para no cambiar la URL *.workers.dev que ya
# tienen instalada los usuarios del addon.
name = "unlimplay-proxy-stream"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Node.js nos da URL, AbortSignal.timeout() y utilidades estándar en el runtime.
compatibility_flags = ["nodejs_compat"]

# Envío de logs a Workers Logs (útil para depurar el scraping).
[observability]
enabled = true

[vars]
# Vimeus es el único proveedor del addon.
VIMEUS_ORIGIN = "https://vimeus.com"

# Si la view_key está limitada por dominio, configura aquí el referer/origen permitido.
# VIMEUS_REFERER = "https://vimeus.com/"

# No guardes VIMEUS_VIEW_KEY en este archivo: configúrala como secreto de Wrangler:
#   npx wrangler secret put VIMEUS_VIEW_KEY

# Rutas del embed de Vimeus (valores por defecto).
# VIMEUS_MOVIE_PATH = "/e/movie"
# VIMEUS_SERIES_PATHS = "/e/serie,/e/anime"

# "1" → el stream apunta a la pasarela HLS del Worker (necesario en Stremio Web).
# "0" → devuelve la URL .m3u8 directa con behaviorHints.requestHeaders (default).
PROXY_HLS = "0"

# "1" → comprueba que el candidato responda una playlist #EXTM3U antes de
# devolverlo a Stremio.
VERIFY_HLS = "1"

# "1" → si el HTML del embed no trae el .m3u8, sigue iframes/configuración
# del reproductor. Vimeus es un agregador: el HLS real está en el iframe del
# host de terceros, así que el deep scan es la ruta habitual. Déjalo en "1".
DEEP_SCAN = "1"

# Nº máximo de páginas extra (iframes/APIs) que sigue el deep scan.
MAX_DEEP_SCAN = "6"

# Token para /debug/{movie|series}/{id}?token=… (traza del scraping).
# Configúralo como secreto sólo mientras depuras: npx wrangler secret put DEBUG_TOKEN

# API Key de la API de listado de Vimeus (cabecera X-API-Key). Opcional: al
# configurarla el manifiesto publica los catálogos "Vimeus · Películas/Series/Anime".
# Es de uso exclusivo en servidor: npx wrangler secret put VIMEUS_API_KEY

# Nº máximo de candidatos .m3u8 devueltos como streams alternativos.
MAX_STREAMS = "3"

# "1" → marca el stream como no reproducible en navegador cuando depende de
# cabeceras propias (Referer). En modo PROXY_HLS se ignora.
NOT_WEB_READY = "1"

# Descomenta para fijar un dominio propio:
# routes = [
#   { pattern = "stremio.tudominio.com", custom_domain = true }
# ]
