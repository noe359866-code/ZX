<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZX — películas, series y addons</title>
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="ZX — películas y series. Addons de Stremio, MediaFlow, TorrServer y Webtor." />
    <link rel="icon" href="/img/favicon.png" />
    <link rel="apple-touch-icon" href="/img/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/css/app.css" />
    <!-- hls.js vendorizado: el reproductor funciona sin CDN ni red externa -->
    <script src="/vendor/hls.min.js" defer></script>
  </head>
  <body>
    <div class="app">
      <header class="mast" id="mast">
        <a class="logo" href="#/" title="ZX">
          <img src="/img/icon-192.png" alt="" />
          <span>ZX</span>
        </a>
        <nav class="nav">
          <button class="nav-link active" data-go="/">Inicio</button>
          <button class="nav-link" data-go="discover?type=movie">Películas</button>
          <button class="nav-link" data-go="discover?type=series">Series</button>
          <button class="nav-link" data-go="library">Mi lista</button>
          <button class="nav-link" data-go="addons">Addons</button>
        </nav>
        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
          <input id="q" type="search" placeholder="Buscar" autocomplete="off" />
        </label>
        <button class="avatar" id="who" title="Cambiar perfil">
          <span class="who-face" id="who-face">P</span>
        </button>
      </header>
      <main class="view" id="view"></main>
    </div>
    <div class="gate hidden" id="gate"></div>
    <div class="player-root" id="player-root"></div>
    <div class="toast-root" id="toast-root"></div>

    <!-- Primer pintado: visible incluso antes de que carguen los módulos. -->
    <div id="boot" role="status" aria-live="polite">
      <style>
        #boot{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:#000;color:#fff;font:600 15px system-ui,sans-serif;text-align:center;padding:24px;transition:opacity .25s ease}
        #boot .z{font:400 84px/1 Impact,"Arial Narrow",sans-serif;letter-spacing:.12em;background:linear-gradient(120deg,#00a8e1,#c44bff);-webkit-background-clip:text;background-clip:text;color:transparent}
        #boot p{color:#9aa5b1;max-width:34rem;margin:12px auto 0;font-weight:400}
        #boot.off{opacity:0;pointer-events:none}
      </style>
      <div>
        <div class="z">ZX</div>
        <p id="boot-msg">Preparando tu pantalla…</p>
      </div>
    </div>
    <script>
      // Si un módulo no carga, que al menos se vea un mensaje útil en vez de una página negra.
      window.addEventListener("error", function (e) {
        var m = document.getElementById("boot-msg");
        var b = document.getElementById("boot");
        if (!m || !b || b.classList.contains("off")) return;
        m.textContent = "No se pudo iniciar la interfaz (" + ((e && e.message) || "error de script") + "). Recarga la página.";
      });
    </script>
    <script type="module" src="/js/app.js"></script>
    <noscript><div style="position:fixed;inset:0;z-index:70;background:#000;color:#fff;display:grid;place-items:center;font:16px system-ui">ZX necesita JavaScript para mostrar el catálogo.</div></noscript>
  </body>
</html>
